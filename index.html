<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lab Project Reviewer</title>
  <style>
    :root {
      --bg: #F2F2F7;
      --card-bg: #FFFFFF;
      --primary: #007AFF;
      --text: #1C1C1E;
      --text-sub: #8E8E93;
      --border: #E5E5EA;
      --danger: #FF3B30;
      --warning: #FF9500;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      padding-bottom: 50px;
    }

    h1 { font-size: 22px; margin-bottom: 12px; font-weight: 700; }
    h2 { font-size: 18px; margin-top: 0; margin-bottom: 8px; color: #000; }

    .btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px 16px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 15px;
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 10px;
      cursor: pointer;
      text-align: center;
    }

    .btn-secondary { background-color: #E5E5EA; color: #000; }
    .btn-danger { background-color: #FFE5E5; color: var(--danger); }

    .card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      position: relative;
    }

    .lab-tag {
      display: inline-block;
      background: #E1F0FF;
      color: var(--primary);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      background: #E5E5EA;
      float: right;
    }

    .task-list { list-style: none; padding: 0; margin: 12px 0; }
    .task-item {
      display: flex;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }
    .task-item:last-child { border-bottom: none; }
    .task-item input { margin-right: 12px; transform: scale(1.3); cursor: pointer; }

    .notes-box {
      background: #F9F9FB;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
      color: #444;
      margin-top: 10px;
      white-space: pre-wrap;
      line-height: 1.4;
    }

    .deadline { font-size: 12px; color: var(--warning); margin-top: 6px; font-weight: 600; }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 999;
    }

    .modal {
      background: white;
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      padding: 20px;
      box-sizing: border-box;
      max-height: 90vh;
      overflow-y: auto;
    }

    select, textarea, input[type="text"], input[type="date"] {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-top: 6px;
      margin-bottom: 12px;
      box-sizing: border-box;
      font-size: 14px;
    }

    .action-btn-group { display: flex; gap: 8px; margin-top: 8px; }
  </style>
</head>
<body>

  <h1>🧪 Lab Project Reviewer</h1>
  <button class="btn" onclick="startWeeklyReview()">🔄 開始每週 Review 模式</button>
  <button class="btn btn-secondary" onclick="addNewProject()">➕ 新增 Project</button>
  <button class="btn btn-danger" style="font-size:12px; padding:6px; margin-bottom:16px;" onclick="clearAllDemo()">🗑️ 清空所有範例數據</button>

  <div id="projectContainer"></div>

  <!-- Review Modal -->
  <div id="reviewModal" class="modal-overlay" style="display:none;">
    <div class="modal">
      <div id="modalLab" class="lab-tag">Lab A</div>
      <h2 id="modalTitle">Project Name</h2>
      
      <label><b>Update Status:</b></label>
      <select id="modalStatus">
        <option value="Pending start">Pending start</option>
        <option value="Idea only">Idea only</option>
        <option value="In progress">In progress</option>
        <option value="Manuscript writing">Manuscript writing</option>
        <option value="Submitted">Submitted</option>
        <option value="Under review">Under review</option>
        <option value="Published/Finished">Published/Finished</option>
      </select>

      <label><b>備註情況 (上次 Input):</b></label>
      <textarea id="modalNotes" rows="3" placeholder="輸入最新情況備註..."></textarea>

      <div class="action-btn-group">
        <button class="btn" onclick="saveReviewStep()">更新並下一頁</button>
        <button class="btn btn-secondary" onclick="nextReviewStep()">No Changes</button>
      </div>
    </div>
  </div>

  <script>
    const defaultData = [
      {
        id: 1,
        lab: "Lab Alpha",
        name: "Aging & Intergenerational Relationships Study",
        status: "In progress",
        deadline: "2026-08-15",
        notes: "已完成問卷收集，準備進行數據分析。",
        subtasks: [
          { id: 101, text: "清理數據集 (Data Cleaning)", done: false },
          { id: 102, text: "撰寫 Introduction 段落", done: false },
          { id: 103, text: "確定研究假設 (Hypotheses)", done: true }
        ]
      },
      {
        id: 2,
        lab: "Lab Beta",
        name: "Motivational Interviewing Intervention Protocol",
        status: "Manuscript writing",
        deadline: "2026-08-05",
        notes: "等待 Co-author 反饋 Discussion 部分。",
        subtasks: [
          { id: 201, text: "修正 References 格式", done: false }
        ]
      }
    ];

    let projects = JSON.parse(localStorage.getItem('lab_projects')) || defaultData;
    let currentReviewIndex = 0;

    function saveStorage() {
      localStorage.setItem('lab_projects', JSON.stringify(projects));
      renderProjects();
    }

    function renderProjects() {
      const container = document.getElementById('projectContainer');
      container.innerHTML = '';

      if (projects.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:var(--text-sub); padding:40px 0;">目前沒有 Project，點擊上方「➕ 新增 Project」開始吧！</div>';
        return;
      }

      projects.forEach((proj, pIdx) => {
        const activeTasks = proj.subtasks.filter(t => !t.done);
        const archivedCount = proj.subtasks.filter(t => t.done).length;

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <span class="lab-tag">${proj.lab}</span>
          <span class="status-badge">${proj.status}</span>
          <h2>${proj.name}</h2>
          ${proj.deadline ? `<div class="deadline">⏰ Deadline: ${proj.deadline}</div>` : ''}
          
          <ul class="task-list">
            ${activeTasks.map(t => `
              <li class="task-item">
                <input type="checkbox" onchange="toggleSubtask(${pIdx}, ${t.id})">
                <span>${t.text}</span>
              </li>
            `).join('')}
          </ul>
          
          <div style="font-size:12px; color:var(--text-sub);">
            ${archivedCount > 0 ? `📦 已完成/歸檔 Task: ${archivedCount} 個` : ''}
          </div>

          ${proj.notes ? `<div class="notes-box">📝 <b>上次備註：</b>\n${proj.notes}</div>` : ''}
          
          <div style="margin-top: 12px; display:flex; gap:8px;">
            <button class="btn btn-secondary" style="padding:6px 12px; font-size:12px; width:auto; margin:0;" onclick="addSubtask(${pIdx})">+ Sub-task</button>
            <button class="btn btn-secondary" style="padding:6px 12px; font-size:12px; width:auto; margin:0;" onclick="editProject(${pIdx})">✏️ 編輯</button>
            <button class="btn btn-danger" style="padding:6px 12px; font-size:12px; width:auto; margin:0;" onclick="deleteProject(${pIdx})">🗑️ 刪除</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function toggleSubtask(pIdx, taskId) {
      const task = projects[pIdx].subtasks.find(t => t.id === taskId);
      if (task) {
        task.done = true;
        saveStorage();
      }
    }

    function addSubtask(pIdx) {
      const text = prompt("請輸入新增的 Sub-task 內容：");
      if (text) {
        projects[pIdx].subtasks.push({ id: Date.now(), text: text, done: false });
        saveStorage();
      }
    }

    function editProject(pIdx) {
      const proj = projects[pIdx];
      const newLab = prompt("修改 Lab 名稱：", proj.lab);
      if (newLab === null) return;
      const newName = prompt("修改 Project 名稱：", proj.name);
      if (newName === null) return;
      const newDeadline = prompt("修改 Deadline (YYYY-MM-DD)：", proj.deadline || "");

      proj.lab = newLab || proj.lab;
      proj.name = newName || proj.name;
      proj.deadline = newDeadline !== null ? newDeadline : proj.deadline;
      saveStorage();
    }

    function deleteProject(pIdx) {
      if (confirm("確定要刪除這個 Project 嗎？")) {
        projects.splice(pIdx, 1);
        saveStorage();
      }
    }

    function clearAllDemo() {
      if (confirm("確定要清空所有資料（包括範例）嗎？")) {
        projects = [];
        saveStorage();
      }
    }

    function startWeeklyReview() {
      if (projects.length === 0) return alert("目前沒有 Project！");
      currentReviewIndex = 0;
      showReviewModal();
    }

    function showReviewModal() {
      if (currentReviewIndex >= projects.length) {
        document.getElementById('reviewModal').style.display = 'none';
        alert("🎉 每週 Review 已完成！");
        return;
      }

      const proj = projects[currentReviewIndex];
      document.getElementById('modalLab').innerText = proj.lab;
      document.getElementById('modalTitle').innerText = proj.name;
      document.getElementById('modalStatus').value = proj.status;
      document.getElementById('modalNotes').value = proj.notes || '';
      document.getElementById('reviewModal').style.display = 'flex';
    }

    function saveReviewStep() {
      const proj = projects[currentReviewIndex];
      proj.status = document.getElementById('modalStatus').value;
      proj.notes = document.getElementById('modalNotes').value;
      saveStorage();
      nextReviewStep();
    }

    function nextReviewStep() {
      currentReviewIndex++;
      showReviewModal();
    }

    function addNewProject() {
      const lab = prompt("請輸入 Lab 名稱 (例如: Lab A)：");
      const name = prompt("請輸入 Project 名稱：");
      const deadline = prompt("請輸入 Deadline (YYYY-MM-DD，可空白)：");

      if (lab && name) {
        projects.push({
          id: Date.now(),
          lab: lab,
          name: name,
          status: "Pending start",
          deadline: deadline || "",
          notes: "",
          subtasks: []
        });
        saveStorage();
      }
    }

    renderProjects();
  </script>
</body>
</html>
